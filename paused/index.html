<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#06141b">
    <meta name="robots" content="noindex">
    <title>VisaSnap Paused</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        background:
          linear-gradient(118deg, rgba(14, 165, 233, 0.18) 0 18%, transparent 18% 100%),
          linear-gradient(142deg, transparent 0 54%, rgba(249, 115, 22, 0.18) 54% 72%, transparent 72% 100%),
          linear-gradient(135deg, #06141b, #0f172a 58%, #123143);
        color: #f8fbff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: max(22px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      }

      main {
        display: grid;
        gap: 16px;
        width: min(100%, 520px);
        padding: 22px;
        border: 1px solid rgba(226, 232, 240, 0.14);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.84);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.36);
      }

      p,
      h1 {
        margin: 0;
      }

      .eyebrow {
        color: #a7f3d0;
        font-size: 0.76rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.5rem, 13vw, 4.2rem);
        line-height: 0.95;
      }

      p {
        color: #b9c7d2;
        line-height: 1.5;
      }

      a {
        display: grid;
        min-height: 46px;
        place-items: center;
        border-radius: 8px;
        background: linear-gradient(135deg, #0891b2, #14b8a6 54%, #f97316);
        color: #ffffff;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Temporary pause</p>
      <h1>VisaSnap</h1>
      <p>The public app is paused while we tune the camera and photo cleanup experience.</p>
      <p>Use the test deployment while fixes are reviewed from your phone.</p>
      <a href="https://test--visasnap-photo-tool.netlify.app">Open test deployment</a>
    </main>
  </body>
</html>
